<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <style>
    .title { font: 600 18px/1.1 'Segoe UI', system-ui, sans-serif; fill:#222 }
    .label { font: 500 12px/1.1 'Segoe UI', system-ui, sans-serif; fill:#222 }
    .hex { font: 400 11px/1.1 'Segoe UI', system-ui, monospace; fill:#222 }
    .col-title { font: 700 14px/1.1 'Segoe UI', system-ui, sans-serif; fill:#111 }
    .preview-text { font: 600 13px/1.1 'Segoe UI', system-ui, sans-serif }
    .card-title { font: 700 14px/1.1 'Segoe UI', system-ui, sans-serif }
    .card-body { font: 400 12px/1.1 'Segoe UI', system-ui, sans-serif }
  </style>

  <rect x="0" y="0" width="1100" height="700" fill="#ffffff" />
  <text x="20" y="28" class="title">Color Palettes — Current Light Theme + 4 Dark Theme Options</text>

  <!-- Column positions -->
  <!-- 5 columns, each 210px wide with 20px gap: x = 20 + i*(210+20) -->

  <!-- Data for each column: title, and swatches -->

  <!-- Light (Current) -->
  <g transform="translate(20,60)">
    <text class="col-title" x="0" y="0">Light (current)</text>

    <!-- swatches: bg-primary, bg-secondary, bg-card, border, text, accent, link, code, header, toggle -->
    <g transform="translate(0,18)">
      <rect x="0" y="0" width="200" height="34" fill="#ffffff" stroke="#ddd"/>
      <text x="8" y="22" class="label" fill="#000">Background</text>
      <text x="160" y="22" class="hex">#ffffff</text>

      <rect x="0" y="44" width="200" height="34" fill="#d4eff9" stroke="#ddd"/>
      <text x="8" y="66" class="label">Secondary</text>
      <text x="160" y="66" class="hex">#d4eff9</text>

      <rect x="0" y="88" width="200" height="34" fill="#ffffff" stroke="#ddd"/>
      <text x="8" y="110" class="label">Card</text>
      <text x="160" y="110" class="hex">#ffffff</text>

      <rect x="0" y="132" width="200" height="34" fill="#1a6f8a" stroke="#ddd"/>
      <text x="8" y="154" class="label" fill="#fff">Border</text>
      <text x="160" y="154" class="hex" fill="#fff">#1a6f8a</text>

      <rect x="0" y="176" width="200" height="34" fill="#ffffff" stroke="#ddd"/>
      <text x="8" y="198" class="label" fill="#000">Text</text>
      <text x="160" y="198" class="hex" fill="#000">#000000</text>

      <rect x="0" y="220" width="200" height="34" fill="#40baec" stroke="#ddd"/>
      <text x="8" y="242" class="label" fill="#fff">Accent</text>
      <text x="160" y="242" class="hex" fill="#fff">#40baec</text>

      <rect x="0" y="264" width="200" height="34" fill="#40baec" stroke="#ddd"/>
      <text x="8" y="286" class="label" fill="#fff">Link</text>
      <text x="160" y="286" class="hex" fill="#fff">#40baec</text>

      <rect x="0" y="308" width="200" height="34" fill="#d4eff9" stroke="#ddd"/>
      <text x="8" y="330" class="label">Code bg</text>
      <text x="160" y="330" class="hex">#d4eff9</text>

      <rect x="0" y="352" width="200" height="34" fill="#1a6f8a" stroke="#ddd"/>
      <text x="8" y="374" class="label" fill="#fff">Header</text>
      <text x="160" y="374" class="hex" fill="#fff">#1a6f8a</text>

      <rect x="0" y="396" width="200" height="34" fill="#1a6f8a" stroke="#ddd"/>
      <text x="8" y="418" class="label" fill="#fff">Toggle</text>
      <text x="160" y="418" class="hex" fill="#fff">#1a6f8a</text>

      <!-- Previews -->
      <rect x="0" y="446" width="200" height="40" fill="#1a6f8a"/>
      <text x="12" y="472" class="preview-text" fill="#ffffff">Header preview</text>

      <rect x="0" y="492" width="200" height="90" fill="#ffffff" stroke="#1a6f8a"/>
      <text x="12" y="522" class="card-title" fill="#000000">Card title</text>
      <text x="12" y="537" class="card-body" fill="#000000" dominant-baseline="middle">Card body text preview</text>
    </g>
  </g>

  <!-- Dark Option 1: Teal Night -->
  <g transform="translate(250,60)">
    <text class="col-title" x="0" y="0">Dark — Teal Night</text>
    <g transform="translate(0,18)">
      <rect x="0" y="0" width="200" height="34" fill="#071021" stroke="#0a0a0a"/>
      <text x="8" y="22" class="label" fill="#fff">Background</text>
      <text x="160" y="22" class="hex" fill="#fff">#071021</text>

      <rect x="0" y="44" width="200" height="34" fill="#0d2730"/>
      <text x="8" y="66" class="label" fill="#fff">Secondary</text>
      <text x="160" y="66" class="hex" fill="#fff">#0d2730</text>

      <rect x="0" y="88" width="200" height="34" fill="#0f2b36"/>
      <text x="8" y="110" class="label" fill="#fff">Card</text>
      <text x="160" y="110" class="hex" fill="#fff">#0f2b36</text>

      <rect x="0" y="132" width="200" height="34" fill="#1a6f8a"/>
      <text x="8" y="154" class="label" fill="#fff">Border</text>
      <text x="160" y="154" class="hex" fill="#fff">#1a6f8a</text>

      <rect x="0" y="176" width="200" height="34" fill="#071021"/>
      <text x="8" y="198" class="label" fill="#fff">Text</text>
      <text x="160" y="198" class="hex" fill="#fff">#ffffff</text>

      <rect x="0" y="220" width="200" height="34" fill="#40baec"/>
      <text x="8" y="242" class="label" fill="#ffffff">Accent</text>
      <text x="160" y="242" class="hex" fill="#ffffff">#40baec</text>

      <rect x="0" y="264" width="200" height="34" fill="#40baec"/>
      <text x="8" y="286" class="label" fill="#ffffff">Link</text>
      <text x="160" y="286" class="hex" fill="#ffffff">#40baec</text>

      <rect x="0" y="308" width="200" height="34" fill="#071821"/>
      <text x="8" y="330" class="label" fill="#fff">Code bg</text>
      <text x="160" y="330" class="hex" fill="#fff">#071821</text>

      <rect x="0" y="352" width="200" height="34" fill="#0b2330"/>
      <text x="8" y="374" class="label" fill="#fff">Header</text>
      <text x="160" y="374" class="hex" fill="#fff">#0b2330</text>

      <rect x="0" y="396" width="200" height="34" fill="#133444"/>
      <text x="8" y="418" class="label" fill="#fff">Toggle</text>
      <text x="160" y="418" class="hex" fill="#fff">#133444</text>

      <rect x="0" y="446" width="200" height="40" fill="#0b2330"/>
      <text x="12" y="472" class="preview-text" fill="#ffffff">Header preview</text>

      <rect x="0" y="492" width="200" height="90" fill="#0f2b36" stroke="#1a6f8a"/>
      <text x="12" y="522" class="card-title" fill="#ffffff">Card title</text>
      <text x="12" y="537" class="card-body" fill="#ffffff" dominant-baseline="middle">Card body text preview</text>
    </g>
  </g>

  <!-- Dark Option 2: Teal Night — Lighter -->
  <g transform="translate(480,60)">
    <text class="col-title" x="0" y="0">Teal Night — Lighter</text>
    <g transform="translate(0,18)">
      <rect x="0" y="0" width="200" height="34" fill="#0b2730"/>
      <text x="8" y="22" class="label" fill="#ffffff">Background</text>
      <text x="160" y="22" class="hex" fill="#ffffff">#0b2730</text>

      <rect x="0" y="44" width="200" height="34" fill="#12303a"/>
      <text x="8" y="66" class="label" fill="#ffffff">Secondary</text>
      <text x="160" y="66" class="hex" fill="#ffffff">#12303a</text>

      <rect x="0" y="88" width="200" height="34" fill="#15353f"/>
      <text x="8" y="110" class="label" fill="#ffffff">Card</text>
      <text x="160" y="110" class="hex" fill="#ffffff">#15353f</text>

      <rect x="0" y="132" width="200" height="34" fill="#1a6f8a"/>
      <text x="8" y="154" class="label" fill="#fff">Border</text>
      <text x="160" y="154" class="hex" fill="#fff">#1a6f8a</text>

      <rect x="0" y="176" width="200" height="34" fill="#0b2730"/>
      <text x="8" y="198" class="label" fill="#ffffff">Text</text>
      <text x="160" y="198" class="hex" fill="#ffffff">#ffffff</text>

      <rect x="0" y="220" width="200" height="34" fill="#40baec"/>
      <text x="8" y="242" class="label" fill="#ffffff">Accent</text>
      <text x="160" y="242" class="hex" fill="#ffffff">#40baec</text>

      <rect x="0" y="264" width="200" height="34" fill="#40baec"/>
      <text x="8" y="286" class="label" fill="#ffffff">Link</text>
      <text x="160" y="286" class="hex" fill="#ffffff">#40baec</text>

      <rect x="0" y="308" width="200" height="34" fill="#0b2730"/>
      <text x="8" y="330" class="label" fill="#fff">Code bg</text>
      <text x="160" y="330" class="hex" fill="#fff">#0b2730</text>

      <rect x="0" y="352" width="200" height="34" fill="#102a38"/>
      <text x="8" y="374" class="label" fill="#fff">Header</text>
      <text x="160" y="374" class="hex" fill="#fff">#102a38</text>

      <rect x="0" y="396" width="200" height="34" fill="#173f52"/>
      <text x="8" y="418" class="label" fill="#fff">Toggle</text>
      <text x="160" y="418" class="hex" fill="#fff">#173f52</text>

      <rect x="0" y="446" width="200" height="40" fill="#102a38"/>
      <text x="12" y="472" class="preview-text" fill="#ffffff">Header preview</text>

      <rect x="0" y="492" width="200" height="90" fill="#15353f" stroke="#1a6f8a"/>
      <text x="12" y="522" class="card-title" fill="#ffffff">Card title</text>
      <text x="12" y="537" class="card-body" fill="#ffffff" dominant-baseline="middle">Card body text preview</text>
    </g>
  </g>

  <!-- Dark Option 3: Teal Night — Lighter 2 -->
  <g transform="translate(710,60)">
    <text class="col-title" x="0" y="0">Teal Night — Lighter 2</text>
    <g transform="translate(0,18)">
      <rect x="0" y="0" width="200" height="34" fill="#102a34"/>
      <text x="8" y="22" class="label" fill="#ffffff">Background</text>
      <text x="160" y="22" class="hex" fill="#ffffff">#102a34</text>

      <rect x="0" y="44" width="200" height="34" fill="#16353f"/>
      <text x="8" y="66" class="label" fill="#ffffff">Secondary</text>
      <text x="160" y="66" class="hex" fill="#ffffff">#16353f</text>

      <rect x="0" y="88" width="200" height="34" fill="#1b3b49"/>
      <text x="8" y="110" class="label" fill="#ffffff">Card</text>
      <text x="160" y="110" class="hex" fill="#ffffff">#1b3b49</text>

      <rect x="0" y="132" width="200" height="34" fill="#1a6f8a"/>
      <text x="8" y="154" class="label" fill="#fff">Border</text>
      <text x="160" y="154" class="hex" fill="#fff">#1a6f8a</text>

      <rect x="0" y="176" width="200" height="34" fill="#102a34"/>
      <text x="8" y="198" class="label" fill="#ffffff">Text</text>
      <text x="160" y="198" class="hex" fill="#ffffff">#ffffff</text>

      <rect x="0" y="220" width="200" height="34" fill="#40baec"/>
      <text x="8" y="242" class="label" fill="#ffffff">Accent</text>
      <text x="160" y="242" class="hex" fill="#ffffff">#40baec</text>

      <rect x="0" y="264" width="200" height="34" fill="#40baec"/>
      <text x="8" y="286" class="label" fill="#ffffff">Link</text>
      <text x="160" y="286" class="hex" fill="#ffffff">#40baec</text>

      <rect x="0" y="308" width="200" height="34" fill="#102a34"/>
      <text x="8" y="330" class="label" fill="#fff">Code bg</text>
      <text x="160" y="330" class="hex" fill="#fff">#102a34</text>

      <rect x="0" y="352" width="200" height="34" fill="#15303e"/>
      <text x="8" y="374" class="label" fill="#fff">Header</text>
      <text x="160" y="374" class="hex" fill="#fff">#15303e</text>

      <rect x="0" y="396" width="200" height="34" fill="#1b4658"/>
      <text x="8" y="418" class="label" fill="#fff">Toggle</text>
      <text x="160" y="418" class="hex" fill="#fff">#1b4658</text>

      <rect x="0" y="446" width="200" height="40" fill="#15303e"/>
      <text x="12" y="472" class="preview-text" fill="#ffffff">Header preview</text>

      <rect x="0" y="492" width="200" height="90" fill="#1b3b49" stroke="#1a6f8a"/>
      <text x="12" y="522" class="card-title" fill="#ffffff">Card title</text>
      <text x="12" y="537" class="card-body" fill="#ffffff" dominant-baseline="middle">Card body text preview</text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="20" y="688" class="label">Notes: Accent kept as #40baec; border color unified to #1a6f8a across themes for consistency.</text>
</svg>
